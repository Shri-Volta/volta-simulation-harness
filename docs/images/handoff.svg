<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250"
     role="img" aria-label="The case author validates a case and hands it to the harness, which provisions a private repository for the student. The student submits a frozen attempt to the reviewer, who can reopen it to create a second attempt. Protected case truth never crosses to the student side.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>
  <g fill="none" stroke="#7d8590" stroke-width="1.5">
    <rect x="14"  y="72" width="150" height="62" rx="7"/>
    <rect x="225" y="72" width="150" height="62" rx="7"/>
    <rect x="436" y="72" width="150" height="62" rx="7"/>
    <rect x="647" y="72" width="139" height="62" rx="7"/>
  </g>
  <g fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     font-size="13" text-anchor="middle" font-weight="600">
    <text x="89"  y="99">Case author</text>
    <text x="300" y="99">Harness</text>
    <text x="511" y="99">Student</text>
    <text x="716" y="99">Reviewer</text>
  </g>
  <g fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     font-size="11" text-anchor="middle" opacity=".8">
    <text x="89"  y="118">writes the case</text>
    <text x="300" y="118">validates, freezes</text>
    <text x="511" y="118">own repo + agent</text>
    <text x="716" y="118">judges by hand</text>
  </g>
  <g stroke="#7d8590" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="164" y1="103" x2="219" y2="103"/>
    <line x1="375" y1="103" x2="430" y2="103"/>
    <line x1="586" y1="103" x2="641" y2="103"/>
  </g>
  <g fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     font-size="10.5" text-anchor="middle" opacity=".9">
    <text x="192" y="63">validated case</text>
    <text x="403" y="57">private repo</text>
    <text x="403" y="70">+ student bundle</text>
    <text x="614" y="57">frozen</text>
    <text x="614" y="70">submission</text>
  </g>
  <path d="M 716 134 L 716 196 L 511 196 L 511 140" fill="none" stroke="#7d8590"
        stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)" opacity=".9"/>
  <text x="613" y="214" fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="10.5" text-anchor="middle" opacity=".9">reopen &#8594; attempt 2</text>
  <line x1="405" y1="20" x2="405" y2="230" stroke="#7d8590" stroke-width="1" stroke-dasharray="3 5" opacity=".45"/>
  <text x="405" y="240" fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="10" text-anchor="middle" opacity=".7">protected case truth never crosses to the right</text>
</svg>
