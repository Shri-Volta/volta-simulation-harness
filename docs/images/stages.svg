<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130"
     role="img" aria-label="Seven stages in sequence: invited, set up, discover, record, decide, submit, await review. Discover and record repeat as a loop until the evidence is enough, and a review may reopen the attempt as a second attempt.">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
  </defs>
  <g fill="none" stroke="#7d8590" stroke-width="1.4">
    <rect x="8"   y="36" width="96"  height="40" rx="6"/>
    <rect x="120" y="36" width="96"  height="40" rx="6"/>
    <rect x="232" y="36" width="96"  height="40" rx="6"/>
    <rect x="344" y="36" width="96"  height="40" rx="6"/>
    <rect x="456" y="36" width="96"  height="40" rx="6"/>
    <rect x="568" y="36" width="96"  height="40" rx="6"/>
    <rect x="680" y="36" width="112" height="40" rx="6"/>
  </g>
  <g fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     font-size="12" text-anchor="middle" font-weight="600">
    <text x="56"  y="61">Invited</text>
    <text x="168" y="61">Set up</text>
    <text x="280" y="61">Discover</text>
    <text x="392" y="61">Record</text>
    <text x="504" y="61">Decide</text>
    <text x="616" y="61">Submit</text>
    <text x="736" y="61">Await review</text>
  </g>
  <g stroke="#7d8590" stroke-width="1.4" marker-end="url(#s)">
    <line x1="104" y1="56" x2="116" y2="56"/>
    <line x1="216" y1="56" x2="228" y2="56"/>
    <line x1="328" y1="56" x2="340" y2="56"/>
    <line x1="440" y1="56" x2="452" y2="56"/>
    <line x1="552" y1="56" x2="564" y2="56"/>
    <line x1="664" y1="56" x2="676" y2="56"/>
  </g>
  <path d="M 392 76 L 392 100 L 280 100 L 280 80" fill="none" stroke="#7d8590"
        stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#s)" opacity=".9"/>
  <text x="336" y="118" fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="10" text-anchor="middle" opacity=".85">repeat until the evidence is enough</text>
  <text x="736" y="26" fill="#7d8590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="10" text-anchor="middle" opacity=".85">may reopen &#8594; attempt 2</text>
</svg>
